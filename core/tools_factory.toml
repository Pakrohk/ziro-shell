# ==============================================================================
# ziro-shell — Factory Tools Registry (core/tools_factory.toml)
# Layer: 0 (Config / Architecture) · Spec: 006 v0.2.0 · Version: 1.0.0
# ==============================================================================
# Single source of truth for all tools known to ziro-shell.
# Replaces hardcoded generator logic with a pure declarative registry.
#
# SCHEMA SPECIFICATION:
# ---------------------
# - name              (str, req)  : Unique identifier in kebab-case (e.g. "fast-syntax-highlighting").
# - type              (enum, req) : Fundamental tool classification:
#                                   "plugin"    : Zsh plugin / repo (cloned or local).
#                                   "binary"    : External system binary (compiled CLI tool).
#                                   "builtin"   : Zsh built-in facility (e.g. compinit).
#                                   "bootstrap" : Core infrastructure shell script.
# - category          (enum, req) : Functional category matching defaults.toml keys:
#                                   "prompt", "auto_suggest", "syntax_highlighting",
#                                   "completions", "colors", "navigation",
#                                   "fuzzy_finder", "git", "core", "infra".
# - load_method       (enum, req) : How the tool code is invoked:
#                                   "binary-eval"      : (( $+commands[B] )) && znap eval B 'INIT_CMD'
#                                   "clone-eval"       : znap eval REPO 'EVAL_CMD'
#                                   "clone-source"     : [ziro-defer] znap source REPO [SUBPATH]
#                                   "local-source"     : [ziro-defer] [ziro local] source PATH
#                                   "builtin-load"     : Builtin invocation (e.g. compinit)
#                                   "bootstrap-source" : Direct source of core runtime shim
# - load_timing       (enum, req) : When in the shell lifecycle the tool is loaded:
#                                   "eager"  : Sourced synchronously during Layer 0 bootstrap.
#                                   "defer"  : Deferred via ziro-defer (runs on idle after prompt).
#                                   "eval"   : Evaluated via znap eval with cache.
#                                   "prompt" : Sourced after prompt configuration.
# - load_order        (int, req)  : Order of emission in plugins.gen.zsh (1=first, N=last).
# - guard             (enum, req) : Safety check before loading:
#                                   "none"         : No runtime check required.
#                                   "binary-check" : Guard with (( $+commands[binary_name] )).
#
# CONDITIONAL FIELDS:
# - source            (str)       : GitHub slug (user/repo) or path for cloned/bootstrap tools.
# - subpath           (str)       : Sub-directory inside repository (e.g. "plugins/git").
# - binary_name       (str)       : Executable name checked by $+commands when guard="binary-check".
# - init_command      (str)       : Command string executed for "binary-eval".
# - eval_command      (str)       : In-repo command executed for "clone-eval".
# - local_path        (str)       : File path for "local-source" (supports $ZIRO_HOME).
# - cache_key         (str)       : Key identifier for znap eval cache file.
# - alternatives_only (bool)      : If true, not loaded by default; active only when selected.
# - conflicts_with    (list[str]) : List of tool names that cannot be active simultaneously.
# - github            (str)       : Canonical upstream repository URL.
# - description       (str)       : Short summary of functionality.
# ==============================================================================

[meta]
schema_version = "1.0.0"
generated_by = "ziro core"
description = "Declarative tools registry for ziro-shell"

# ------------------------------------------------------------------------------
# 1. BOOTSTRAP INFRASTRUCTURE (Layer 0 Bootstrap)
# ------------------------------------------------------------------------------

[[tool]]
name = "znap"
type = "bootstrap"
category = "infra"
load_method = "bootstrap-source"
load_timing = "eager"
load_order = 0
guard = "none"
source = "$ZIRO_HOME/vendor/znap/znap.zsh"
github = "https://github.com/marlonrichert/zsh-snap"
description = "Fast, lightweight Zsh plugin manager and eval cacher."

[[tool]]
name = "ziro-defer"
type = "bootstrap"
category = "infra"
load_method = "bootstrap-source"
load_timing = "eager"
load_order = 0
guard = "none"
source = "$ZIRO_HOME/ziro-defer/ziro-defer.plugin.zsh"
github = "https://github.com/romkatv/zsh-defer"
description = "Defers execution until Zsh is idle; <1ms load overhead."

# ------------------------------------------------------------------------------
# 2. DEFAULT ACTIVE TOOLS (Ordered 1 to 10)
# ------------------------------------------------------------------------------

[[tool]]
name = "zsh-completions"
type = "plugin"
category = "completions"
load_method = "clone-source"
load_timing = "eager"
load_order = 1
guard = "none"
source = "zsh-users/zsh-completions"
github = "https://github.com/zsh-users/zsh-completions"
description = "Additional completion definitions for Zsh (must load before compinit)."

[[tool]]
name = "ohmyzsh-git"
type = "plugin"
category = "git"
load_method = "clone-source"
load_timing = "eager"
load_order = 2
guard = "none"
source = "ohmyzsh/ohmyzsh"
subpath = "plugins/git"
github = "https://github.com/ohmyzsh/ohmyzsh/tree/master/plugins/git"
description = "Git aliases and functions with compdef definitions."

[[tool]]
name = "compinit"
type = "builtin"
category = "core"
load_method = "builtin-load"
load_timing = "eager"
load_order = 3
guard = "none"
description = "Zsh standard completion system initialization."

[[tool]]
name = "starship"
type = "binary"
category = "prompt"
load_method = "binary-eval"
load_timing = "eval"
load_order = 4
guard = "binary-check"
binary_name = "starship"
init_command = "starship init zsh --print-full-init"
cache_key = "starship"
conflicts_with = ["powerlevel10k", "pure"]
github = "https://github.com/starship/starship"
description = "Fast, customizable prompt for any shell."

[[tool]]
name = "fzf"
github = "https://github.com/junegunn/fzf"
description = "General-purpose command-line fuzzy finder."
category = "fuzzy_finder"
type = "binary"
load_method = "binary-eval"
load_timing = "on-demand"
load_order = 5
guard = "binary-check"
binary_name = "fzf"
trigger_type = "key"
trigger_keys = [
  { key = "^R", widget = "fzf-history-widget" },
  { key = "^T", widget = "fzf-file-widget" },
  { key = "^[c", widget = "fzf-cd-widget" },
]
cache_key = "fzf"
init_command = "fzf --zsh"
requires = "fzf"
theme_supported = false
notes = "On-demand: first key sources cache; stays loaded for session."

[[tool]]
name = "ziro-ghost"
type = "plugin"
category = "auto_suggest"
load_method = "clone-source"
load_timing = "defer"
load_order = 6
guard = "none"
source = "Pakrohk/ziro-ghost"
conflicts_with = ["zsh-autosuggestions"]
github = "https://github.com/Pakrohk/ziro-ghost"
description = "IDE-like autocomplete for Zsh (standalone, v1.0.0)"

[[tool]]
name = "fast-syntax-highlighting"
type = "plugin"
category = "syntax_highlighting"
load_method = "clone-source"
load_timing = "defer"
load_order = 99
guard = "none"
source = "zdharma-continuum/fast-syntax-highlighting"
conflicts_with = ["zsh-syntax-highlighting"]
github = "https://github.com/zdharma-continuum/fast-syntax-highlighting"
description = "Feature-rich, pure-Zsh syntax highlighting."

[[tool]]
name = "zcolors"
type = "plugin"
category = "colors"
load_method = "clone-eval"
load_timing = "eval"
load_order = 8
guard = "none"
source = "marlonrichert/zcolors"
eval_command = "./zcolors ${(q)LS_COLORS}"
cache_key = "zcolors"
github = "https://github.com/marlonrichert/zcolors"
description = "Derives a coherent color theme from LS_COLORS for git, grep, less, and completions."

[[tool]]
name = "zoxide"
github = "https://github.com/ajeetdsouza/zoxide"
description = "Smarter cd command."
category = "navigation"
type = "binary"
load_method = "binary-eval"
load_timing = "on-demand"
load_order = 9
guard = "binary-check"
binary_name = "zoxide"
trigger_type = "command"
trigger_commands = ["z", "zi", "za", "zr", "zq"]
cache_key = "zoxide"
init_command = "zoxide init zsh"
requires = "zoxide"
theme_supported = false
notes = "On-demand: first z/zi/za/zr/zq sources cache; stays loaded for session."

[[tool]]
name = "ohmyzsh-colored-man-pages"
type = "plugin"
category = "core"
load_method = "clone-source"
load_timing = "defer"
load_order = 10
guard = "none"
source = "ohmyzsh/ohmyzsh"
subpath = "plugins/colored-man-pages"
github = "https://github.com/ohmyzsh/ohmyzsh/tree/master/plugins/colored-man-pages"
description = "Adds color highlighting to man pages."

# ------------------------------------------------------------------------------
# 3. ALTERNATIVES & OPTIONAL PLUGINS (Configured via defaults.toml)
# ------------------------------------------------------------------------------

[[tool]]
name = "powerlevel10k"
type = "plugin"
category = "prompt"
load_method = "clone-source"
load_timing = "defer"
load_order = 4
guard = "none"
source = "romkatv/powerlevel10k"
alternatives_only = true
conflicts_with = ["starship", "pure"]
github = "https://github.com/romkatv/powerlevel10k"
description = "Fast, flexible powerline theme for Zsh."

[[tool]]
name = "pure"
type = "plugin"
category = "prompt"
load_method = "clone-source"
load_timing = "defer"
load_order = 4
guard = "none"
source = "sindresorhus/pure"
alternatives_only = true
conflicts_with = ["starship", "powerlevel10k"]
github = "https://github.com/sindresorhus/pure"
description = "Pretty, minimal and fast Zsh prompt."

[[tool]]
name = "zsh-autosuggestions"
type = "plugin"
category = "auto_suggest"
load_method = "clone-source"
load_timing = "defer"
load_order = 6
guard = "none"
source = "zsh-users/zsh-autosuggestions"
alternatives_only = true
conflicts_with = ["ziro-ghost"]
github = "https://github.com/zsh-users/zsh-autosuggestions"
description = "Fish-like autosuggestions for Zsh."

[[tool]]
name = "zsh-syntax-highlighting"
type = "plugin"
category = "syntax_highlighting"
load_method = "clone-source"
load_timing = "defer"
load_order = 99
guard = "none"
source = "zsh-users/zsh-syntax-highlighting"
alternatives_only = true
conflicts_with = ["fast-syntax-highlighting"]
github = "https://github.com/zsh-users/zsh-syntax-highlighting"
description = "Fish shell-like syntax highlighting for Zsh."

[[tool]]
name = "z"
type = "plugin"
category = "navigation"
load_method = "clone-source"
load_timing = "defer"
load_order = 9
guard = "none"
source = "rupa/z"
alternatives_only = true
conflicts_with = ["zoxide", "wd"]
github = "https://github.com/rupa/z"
description = "Tracks most used directories to jump around."

[[tool]]
name = "wd"
github = "https://github.com/mfaerevaag/wd"
description = "Jump to tagged directories."
category = "navigation"
type = "plugin"
load_method = "clone-source"
load_timing = "on-demand"
load_order = 9
guard = "none"
source = "$ZIRO_HOME/plugins/wd/wd.plugin.zsh"
alternatives_only = true
trigger_type = "command"
trigger_commands = ["wd"]
theme_supported = false
notes = "On-demand: first wd invocation sources plugin; stays loaded for session."

[[tool]]
name = "zsh-you-should-use"
type = "plugin"
category = "core"
load_method = "clone-source"
load_timing = "defer"
load_order = 11
guard = "none"
source = "MichaelAquilina/zsh-you-should-use"
alternatives_only = false
github = "https://github.com/MichaelAquilina/zsh-you-should-use"
description = "Reminds user when an alias exists for the typed command"

[[tool]]
name = "fzf-tab"
type = "plugin"
category = "core"
load_method = "clone-source"
load_timing = "defer"
load_order = 12
guard = "none"
source = "Aloxaf/fzf-tab"
alternatives_only = false
requires_runtime = ["fzf"]
github = "https://github.com/Aloxaf/fzf-tab"
description = "Replace zsh default completion with fzf menu"

[[tool]]
name = "forgit"
type = "plugin"
category = "core"
load_method = "clone-source"
load_timing = "defer"
load_order = 13
guard = "none"
source = "wfxr/forgit"
alternatives_only = true
requires_runtime = ["fzf"]
conflicts_with = []
github = "https://github.com/wfxr/forgit"
description = "Interactive git operations with fzf (optional)"

[[tool]]
name = "ziro-helpers"
description = "Core shell utility functions."
category = "core"
type = "plugin"
load_method = "local-source"
load_timing = "on-demand"
load_order = 20
guard = "none"
local_path = "$ZIRO_HOME/lib/helpers.zsh"
trigger_type = "function"
trigger_functions = ["mkcd", "take", "extract", "clipcopy", "clippaste"]
source = "$ZIRO_HOME/lib/helpers.zsh"
theme_supported = false
notes = "On-demand: first helper invocation sources file; stays loaded for session. Add new helpers to trigger_functions list."

[[tool]]
name = "ziro-aliases"
type = "plugin"
category = "core"
load_method = "local-source"
load_timing = "defer"
load_order = 21
guard = "none"
local_path = "$ZIRO_HOME/lib/aliases.zsh"
alternatives_only = false
description = "Auto-detected modern CLI aliases (eza, bat, rg, fd)"

[[tool]]
name = "ziro-ssh-config"
type = "plugin"
category = "core"
load_method = "local-source"
load_timing = "eager"
load_order = 14
guard = "none"
local_path = "$ZIRO_HOME/lib/ssh-config.zsh"
alternatives_only = false
description = "SSH agent config: unset gcr/gnome-keyring socket, prefer openssh agent"

[[tool]]
name = "ohmyzsh-ssh-agent"
type = "plugin"
category = "core"
load_method = "local-source"
load_timing = "eager"
load_order = 15
guard = "none"
local_path = "$ZIRO_DATA/vendor/ohmyzsh/ohmyzsh/plugins/ssh-agent/ssh-agent.plugin.zsh"
alternatives_only = false
description = "SSH agent management: start/reuse openssh agent, forward SSH_AUTH_SOCK"

[[tool]]
name = "ziro-aliases-core"
type = "plugin"
category = "core"
load_method = "local-source"
load_timing = "eager"
load_order = 16
guard = "none"
local_path = "$ZIRO_HOME/lib/aliases-core.zsh"
alternatives_only = false
description = "Core aliases: ls color, cd navigation (../...), ll/la with eza fallback"

[[tool]]
name = "ziro-keybindings"
type = "plugin"
category = "core"
load_method = "local-source"
load_timing = "eager"
load_order = 17
guard = "none"
local_path = "$ZIRO_HOME/lib/keybindings.zsh"
alternatives_only = false
description = "Terminal keybindings: Home/End/Delete/PageUp/PageDown"

[[tool]]
name = "ziro-history-refresh"
type = "plugin"
category = "core"
load_method = "local-source"
load_timing = "eager"
load_order = 18
guard = "none"
local_path = "$ZIRO_HOME/lib/history-refresh.zsh"
alternatives_only = false
description = "History cache refresh for ziro-ghost (same-terminal instant + cross-terminal 2s)"




