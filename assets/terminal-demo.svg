<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%" style="max-width: 840px; display: block; border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.45); font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;">
  <defs>
    <linearGradient id="term-header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>
    <style>
      .txt { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13.5px; fill: #cdd6f4; }
      .bold { font-weight: bold; }
      .prompt-host { fill: #f5c2e7; }
      .prompt-path { fill: #89b4fa; font-weight: bold; }
      .prompt-char { fill: #a6e3a1; font-weight: bold; }
      .dir { fill: #89b4fa; font-weight: bold; }
      .exec { fill: #a6e3a1; font-weight: bold; }
      .file { fill: #bac2de; }
      .comment { fill: #6c7086; font-style: italic; }
      .highlight { fill: #fab387; }
      .success { fill: #a6e3a1; }
      .branch { fill: #f9e2af; }

      /* Animation frames */
      @keyframes step1 { 0%, 5% { opacity: 0; } 10%, 95% { opacity: 1; } }
      @keyframes step2 { 0%, 22% { opacity: 0; } 28%, 95% { opacity: 1; } }
      @keyframes step3 { 0%, 48% { opacity: 0; } 54%, 95% { opacity: 1; } }
      @keyframes step4 { 0%, 72% { opacity: 0; } 78%, 95% { opacity: 1; } }

      .anim-s1 { animation: step1 15s infinite; }
      .anim-s2 { animation: step2 15s infinite; }
      .anim-s3 { animation: step3 15s infinite; }
      .anim-s4 { animation: step4 15s infinite; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="840" height="460" rx="10" ry="10" fill="#1e1e2e" stroke="#313244" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <path d="M0,10 C0,4.5 4.5,0 10,0 L830,0 C835.5,0 840,4.5 840,10 L840,38 L0,38 Z" fill="url(#term-header)" />
  <line x1="0" y1="38" x2="840" y2="38" stroke="#313244" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="6" fill="#f38ba8" />
  <circle cx="38" cy="19" r="6" fill="#f9e2af" />
  <circle cx="56" cy="19" r="6" fill="#a6e3a1" />

  <!-- Title Text -->
  <text x="420" y="24" text-anchor="middle" fill="#a6adc8" font-size="12" font-family="'JetBrains Mono', monospace">ali@ziro: ~ (zsh)</text>

  <!-- Terminal Screen Body -->
  <g transform="translate(24, 62)">
    <!-- Line 1: Prompt & ls command -->
    <text x="0" y="0" class="txt">
      <tspan class="prompt-host">ali@ziro</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> ls
    </text>

    <!-- Line 2 & 3: ls output (classified, directories first) -->
    <g class="anim-s1">
      <text x="0" y="24" class="txt">
        <tspan class="dir">Desktop/</tspan>    <tspan class="dir">Documents/</tspan>    <tspan class="dir">Downloads/</tspan>    <tspan class="dir">Projects/</tspan>    <tspan class="dir">Templates/</tspan>
      </text>
      <text x="0" y="44" class="txt">
        <tspan class="exec">backup.sh*</tspan>   <tspan class="file">notes.md</tspan>      <tspan class="file">config.toml</tspan>
      </text>
      <text x="0" y="66" class="txt comment">
        # ^ Directories sorted first with trailing /, executables with *, grouped by type
      </text>
    </g>

    <!-- Line 4: Prompt & cd into deep project -->
    <g class="anim-s2">
      <text x="0" y="104" class="txt">
        <tspan class="prompt-host">ali@ziro</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> cd Projects/ziro-shell
      </text>
      <text x="0" y="126" class="txt comment">
        # chpwd hook seamlessly syncs directory with zoxide in real-time (0ms perceived lag)
      </text>
      <text x="0" y="150" class="txt">
        <tspan class="prompt-host">ali@ziro</tspan> <tspan class="prompt-path">~/Projects/ziro-shell</tspan> <tspan class="branch">(main)</tspan> <tspan class="prompt-char">❯</tspan> lt
      </text>
    </g>

    <!-- Line 5: lt output (tree view) -->
    <g class="anim-s3">
      <text x="0" y="174" class="txt">
        <tspan class="dir">.</tspan>
      </text>
      <text x="0" y="194" class="txt">
        ├── <tspan class="dir">commands/</tspan>       <tspan class="comment">(15 modular commands)</tspan>
      </text>
      <text x="0" y="214" class="txt">
        ├── <tspan class="dir">core/</tspan>           <tspan class="comment">(declarative python engine)</tspan>
      </text>
      <text x="0" y="234" class="txt">
        ├── <tspan class="dir">lib/</tspan>            <tspan class="comment">(eager aliases &amp; hooks)</tspan>
      </text>
      <text x="0" y="254" class="txt">
        └── <tspan class="file">ziro.zsh</tspan>        <tspan class="comment">(dispatcher entrypoint)</tspan>
      </text>
    </g>

    <!-- Line 6: cd away and z jump -->
    <g class="anim-s4">
      <text x="0" y="292" class="txt">
        <tspan class="prompt-host">ali@ziro</tspan> <tspan class="prompt-path">~/Projects/ziro-shell</tspan> <tspan class="branch">(main)</tspan> <tspan class="prompt-char">❯</tspan> cd ~
      </text>
      <text x="0" y="316" class="txt">
        <tspan class="prompt-host">ali@ziro</tspan> <tspan class="prompt-path">~</tspan> <tspan class="prompt-char">❯</tspan> z ziro
      </text>
      <text x="0" y="340" class="txt">
        <tspan class="prompt-host">ali@ziro</tspan> <tspan class="prompt-path">~/Projects/ziro-shell</tspan> <tspan class="branch">(main)</tspan> <tspan class="prompt-char">❯</tspan> <tspan class="success">pwd</tspan>
      </text>
      <text x="0" y="362" class="txt success bold">
        /home/ali/Projects/ziro-shell  <tspan class="highlight">✨ (Jumped instantly — history synchronized!)</tspan>
      </text>
    </g>
  </g>
</svg>
