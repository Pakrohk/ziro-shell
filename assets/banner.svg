<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" height="100%" style="max-width: 960px; display: block; background: #181825;">
  <defs>
    <!-- پس‌زمینه مستطیلی تیره با گوشه‌های کاملاً تیز (Catppuccin Mocha) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="18%" stop-color="#1e1e2e" />
      <stop offset="65%" stop-color="#181825" />
      <stop offset="100%" stop-color="#11111b" />
    </linearGradient>

    <!-- هاله پس‌زمینه منظومه در سمت چپ -->
    <radialGradient id="ziro-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e2e" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#181825" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#11111b" stop-opacity="0" />
    </radialGradient>

    <!-- گرادینت خط باریک بالا و پایین بنر -->
    <linearGradient id="edge-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11111b" stop-opacity="0" />
      <stop offset="18%" stop-color="#f5c2e7" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#89b4fa" stop-opacity="0.65" />
      <stop offset="82%" stop-color="#a6e3a1" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#11111b" stop-opacity="0" />
    </linearGradient>

    <!-- گرادینت هسته مرکزی منظومه -->
    <linearGradient id="core-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>

    <!-- گرادینت حرف Z مرکزی -->
    <linearGradient id="z-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c2e7" />
      <stop offset="50%" stop-color="#cdd6f4" />
      <stop offset="100%" stop-color="#89b4fa" />
    </linearGradient>

    <!-- گرادینت حلقه حرف O در تایپوگرافی لوگو -->
    <linearGradient id="o-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cdd6f4" />
      <stop offset="60%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#a6e3a1" />
    </linearGradient>

    <!-- فیلتر درخشش نئونی ملایم -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- شبکه مهندسی پس‌زمینه بنر -->
    <pattern id="tech-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#313244" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- ================= ماسک‌های تایپ تک‌به‌تک دستورات واقعی ================= -->
    <!-- دستور ۱: ziro sync (9 کاراکتر * 8.5px = 76.5px) -->
    <clipPath id="clip-cmd-1">
      <rect class="mask-cmd-1" x="312" y="146" width="76.5" height="22" />
    </clipPath>

    <!-- دستور ۲: ziro doctor (11 کاراکتر * 8.5px = 93.5px) -->
    <clipPath id="clip-cmd-2">
      <rect class="mask-cmd-2" x="312" y="146" width="93.5" height="22" />
    </clipPath>

    <!-- دستور ۳: ziro analyze --full (19 کاراکتر * 8.5px = 161.5px) -->
    <clipPath id="clip-cmd-3">
      <rect class="mask-cmd-3" x="312" y="146" width="161.5" height="22" />
    </clipPath>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      .orbit-eager, .orbit-deferred, .orbit-demand, .lazy-pulse, .sun-halo,
      .mask-cmd-1, .mask-cmd-2, .mask-cmd-3,
      .cursor-1, .cursor-2, .cursor-3 {
        animation: none !important;
      }
      .mask-cmd-1, .mask-cmd-2, .cursor-1, .cursor-2 { display: none; }
    }

    /* ================= استایل‌های منظومه مداری (سمت چپ) ================= */
    .grid-axis {
      stroke: #313244;
      stroke-width: 1.2;
      stroke-dasharray: 2 6;
      opacity: 0.55;
    }

    .orbit-line {
      fill: none;
      stroke: #313244;
      stroke-width: 1.8;
    }
    .orbit-eager-ring {
      stroke: #f5c2e7;
      stroke-opacity: 0.32;
      stroke-dasharray: 6 4;
    }
    .orbit-deferred-ring {
      stroke: #89b4fa;
      stroke-opacity: 0.28;
      stroke-dasharray: 4 6;
    }
    .orbit-demand-ring {
      stroke: #a6e3a1;
      stroke-opacity: 0.25;
      stroke-dasharray: 2 8;
    }

    /* برچسب‌های فنی روی مدارها */
    .tier-badge {
      fill: #181825;
      stroke: #313244;
      stroke-width: 1.2;
      rx: 4px;
    }
    .tier-label {
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .label-eager { fill: #f5c2e7; }
    .label-deferred { fill: #89b4fa; }
    .label-demand { fill: #a6e3a1; }

    /* هسته مرکزی (Ziro Core) */
    .sun-halo {
      fill: none;
      stroke: #cba6f7;
      stroke-width: 1.8;
      opacity: 0.25;
      transform-origin: 240px 215px;
      animation: pulse-ring 4s ease-in-out infinite;
    }
    .sun {
      fill: url(#core-surface);
      stroke: #cdd6f4;
      stroke-width: 2.5;
      filter: drop-shadow(0 0 14px rgba(203, 166, 247, 0.22));
    }
    .sun-z {
      fill: url(#z-grad);
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 44px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: central;
    }
    .core-sub {
      fill: #6c7086;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-anchor: middle;
    }

    /* انیمیشن چرخش مدارها حول مرکز (240, 215) */
    .orbit-eager {
      transform-origin: 240px 215px;
      animation: spin 6s linear infinite;
    }
    .orbit-deferred {
      transform-origin: 240px 215px;
      animation: spin 12s linear infinite;
    }
    .orbit-demand {
      transform-origin: 240px 215px;
      animation: spin 20s linear infinite;
    }

    /* نودها (ماژول‌های شل) */
    .dot-eager { fill: #f5c2e7; filter: url(#glow); }
    .dot-deferred { fill: #89b4fa; filter: url(#glow); }
    .dot-demand { fill: #a6e3a1; filter: url(#glow); }
    .node-core { fill: #11111b; }

    /* خطوط اتصال و دنباله مدارها */
    .sync-beam {
      stroke: #f5c2e7;
      stroke-width: 1.4;
      stroke-dasharray: 2 3;
      opacity: 0.5;
    }
    .lazy-pulse {
      fill: none;
      stroke: #a6e3a1;
      stroke-width: 1.6;
      transform-origin: 240px 45px;
      animation: ping 3s cubic-bezier(0, 0, 0.2, 1) infinite;
    }

    /* ================= استایل‌های تایپ و لوگوی سمت راست ================= */
    .bg-watermark-text {
      fill: #cdd6f4;
      opacity: 0.035;
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      user-select: none;
    }
    .zshrc-comment {
      fill: #585b70;
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 12.5px;
      font-weight: 600;
    }
    .zshrc-code {
      fill: #a6adc8;
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .cli-text {
      fill: #cdd6f4;
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
    }

    .hl-pink { fill: #f5c2e7; }
    .hl-blue { fill: #89b4fa; }
    .hl-green { fill: #a6e3a1; }

    /* چرخه ۱۲ ثانیه‌ای تقسیم‌شده بین ۳ دستور واقعی (هر دستور ۴ ثانیه) */
    /* ۱. دستور اول: ziro sync (0% تا 33.33% - 9 کاراکتر) */
    .mask-cmd-1 {
      transform-origin: 312px 146px;
      animation: type-cmd-1 12s infinite;
    }
    .cursor-1 {
      fill: #a6e3a1;
      animation: move-cur-1 12s infinite, blink 0.7s step-end infinite;
    }

    /* ۲. دستور دوم: ziro doctor (33.33% تا 66.66% - 11 کاراکتر) */
    .mask-cmd-2 {
      transform-origin: 312px 146px;
      animation: type-cmd-2 12s infinite;
    }
    .cursor-2 {
      fill: #f5c2e7;
      animation: move-cur-2 12s infinite, blink 0.7s step-end infinite;
    }

    /* ۳. دستور سوم: ziro analyze --full (66.66% تا 100% - 19 کاراکتر) */
    .mask-cmd-3 {
      transform-origin: 312px 146px;
      animation: type-cmd-3 12s infinite;
    }
    .cursor-3 {
      fill: #89b4fa;
      animation: move-cur-3 12s infinite, blink 0.7s step-end infinite;
    }

    /* نوار راهنمای پایین (هماهنگ با منظومه) */
    .legend-box {
      fill: #11111b;
      stroke: #313244;
      stroke-width: 1;
    }
    .legend-text {
      fill: #bac2de;
      font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
    }
    .legend-time {
      fill: #6c7086;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
    }

    /* ================= Keyframes ================= */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.22; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }
    @keyframes ping {
      0% { transform: scale(0.9); opacity: 0.85; }
      100% { transform: scale(2.3); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* زمان‌بندی دستور ۱: ziro sync (0% تا 33.3%) */
    @keyframes type-cmd-1 {
      0%, 2% { transform: scaleX(0); animation-timing-function: steps(9, end); }
      12%, 28% { transform: scaleX(1); }
      31%, 100% { transform: scaleX(0); }
    }
    @keyframes move-cur-1 {
      0%, 1.9% { transform: translateX(0px); visibility: visible; }
      2% { transform: translateX(0px); visibility: visible; animation-timing-function: steps(9, end); }
      12%, 30% { transform: translateX(76.5px); visibility: visible; }
      31%, 100% { transform: translateX(0px); visibility: hidden; }
    }

    /* زمان‌بندی دستور ۲: ziro doctor (33.3% تا 66.6%) */
    @keyframes type-cmd-2 {
      0%, 35% { transform: scaleX(0); animation-timing-function: steps(11, end); }
      46%, 61% { transform: scaleX(1); }
      64%, 100% { transform: scaleX(0); }
    }
    @keyframes move-cur-2 {
      0%, 33.2% { transform: translateX(0px); visibility: hidden; }
      33.3%, 34.9% { transform: translateX(0px); visibility: visible; }
      35% { transform: translateX(0px); visibility: visible; animation-timing-function: steps(11, end); }
      46%, 63% { transform: translateX(93.5px); visibility: visible; }
      64%, 100% { transform: translateX(0px); visibility: hidden; }
    }

    /* زمان‌بندی دستور ۳: ziro analyze --full (66.6% تا 100%) */
    @keyframes type-cmd-3 {
      0%, 68% { transform: scaleX(0); animation-timing-function: steps(19, end); }
      83%, 95% { transform: scaleX(1); }
      98%, 100% { transform: scaleX(0); }
    }
    @keyframes move-cur-3 {
      0%, 66.5% { transform: translateX(0px); visibility: hidden; }
      66.6%, 67.9% { transform: translateX(0px); visibility: visible; }
      68% { transform: translateX(0px); visibility: visible; animation-timing-function: steps(19, end); }
      83%, 97% { transform: translateX(161.5px); visibility: visible; }
      98%, 100% { transform: translateX(0px); visibility: hidden; }
    }
  </style>

  <!-- ================= ۱. پس‌زمینه مستطیلی با گوشه‌های کاملاً تیز ================= -->
  <rect x="0" y="0" width="960" height="230" fill="url(#bg-grad)" />
  <rect x="0" y="0" width="960" height="230" fill="url(#tech-grid)" />

  <!-- خطوط نوری در لبه بالا و پایین بنر -->
  <rect x="0" y="0" width="960" height="2" fill="url(#edge-line)" />
  <rect x="0" y="228" width="960" height="2" fill="url(#edge-line)" />

  <!-- خطوط راهنمای افقی در بخش تایپوگرافی -->
  <line x1="265" y1="20" x2="925" y2="20" stroke="#313244" stroke-width="0.75" stroke-opacity="0.5" />
  <line x1="265" y1="138" x2="905" y2="138" stroke="#313244" stroke-width="1" />

  <!-- ================= ۲. منظومه کامل مداری در سمت چپ ================= -->
  <g transform="translate(8, -8) scale(0.575)">
    <!-- هاله پس‌زمینه منظومه -->
    <circle cx="240" cy="215" r="195" fill="url(#ziro-bg)" />

    <!-- خطوط محور مهندسی در پس‌زمینه منظومه -->
    <line class="grid-axis" x1="240" y1="28" x2="240" y2="402" />
    <line class="grid-axis" x1="40" y1="215" x2="440" y2="215" />

    <!-- ۱. مدارهای ثابت و برچسب‌های معماری -->
    <!-- مدار بیرونی: ON-DEMAND (شعاع 170) -->
    <circle class="orbit-line orbit-demand-ring" cx="240" cy="215" r="170" />
    <rect class="tier-badge" x="198" y="375" width="84" height="20" />
    <text class="tier-label label-demand" x="240" y="385">ON-DEMAND</text>

    <!-- مدار میانی: DEFERRED (شعاع 125) -->
    <circle class="orbit-line orbit-deferred-ring" cx="240" cy="215" r="125" />
    <rect class="tier-badge" x="203" y="330" width="74" height="20" />
    <text class="tier-label label-deferred" x="240" y="340">DEFERRED</text>

    <!-- مدار داخلی: EAGER (شعاع 82) -->
    <circle class="orbit-line orbit-eager-ring" cx="240" cy="215" r="82" />
    <rect class="tier-badge" x="211" y="287" width="58" height="20" />
    <text class="tier-label label-eager" x="240" y="297">EAGER</text>

    <!-- ۲. لایه‌های متحرک (انیمیشن‌های منظومه) -->
    <!-- لایه سوم: Demand (۲۰ ثانیه) -->
    <g class="orbit-demand">
      <circle class="lazy-pulse" cx="240" cy="45" r="8" />
      <circle class="dot-demand" cx="240" cy="45" r="8.5" />
      <circle class="node-core" cx="240" cy="45" r="3" />

      <circle class="dot-demand" cx="387.2" cy="300" r="5" opacity="0.75" />
      <circle class="dot-demand" cx="92.8" cy="300" r="4" opacity="0.45" />
    </g>

    <!-- لایه دوم: Deferred (۱۲ ثانیه) -->
    <g class="orbit-deferred">
      <path d="M 190 100.4 A 125 125 0 0 1 240 90" fill="none" stroke="#89b4fa" stroke-width="2.5" stroke-linecap="round" opacity="0.45" />
      <circle class="dot-deferred" cx="240" cy="90" r="7.5" />
      <circle class="node-core" cx="240" cy="90" r="2.5" />

      <circle class="dot-deferred" cx="240" cy="340" r="5" opacity="0.65" />
    </g>

    <!-- لایه اول: Eager (۶ ثانیه) -->
    <g class="orbit-eager">
      <line class="sync-beam" x1="240" y1="167" x2="240" y2="140" />
      <path d="M 195 146.5 A 82 82 0 0 1 240 133" fill="none" stroke="#f5c2e7" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <circle class="dot-eager" cx="240" cy="133" r="6.5" />
    </g>

    <!-- ۳. هسته مرکزی (Ziro Core) -->
    <g>
      <circle class="sun-halo" cx="240" cy="215" r="54" />
      <circle class="sun" cx="240" cy="215" r="46" />
      <text class="sun-z" x="240" y="209">Z</text>
      <text class="core-sub" x="240" y="241">ZIRO</text>
    </g>
  </g>

  <!-- ================= ۳. بخش کدهای واقعی و ترمینال نوبتی (سمت راست) ================= -->
  <!-- الف) واترمارک پس‌زمینه پشت لوگو -->
  <text class="bg-watermark-text" x="288" y="106">~/.config/ziro/boot.zsh</text>

  <!-- ب) خط کانفیگ واقعی در بالای لوگو (.zshrc) -->
  <text class="zshrc-comment" x="295" y="42"># ~/.zshrc</text>
  <text class="zshrc-code" x="385" y="42"><tspan class="hl-pink">source</tspan> ~/.config/ziro/boot.zsh</text>

  <!-- ج) خط فرمان زنده در زیر لوگو: دستورات یکی‌یکی و به نوبت تایپ می‌شوند -->
  <text class="cli-text hl-green" x="295" y="162">❯</text>

  <!-- نوبت ۱: ziro sync (9 کاراکتر = 76.5px) -->
  <g clip-path="url(#clip-cmd-1)">
    <text class="cli-text" x="312" y="162">ziro <tspan class="hl-green">sync</tspan></text>
  </g>
  <rect class="cursor-1" x="312" y="149" width="7.5" height="15" />

  <!-- نوبت ۲: ziro doctor (11 کاراکتر = 93.5px) -->
  <g clip-path="url(#clip-cmd-2)">
    <text class="cli-text" x="312" y="162">ziro <tspan class="hl-pink">doctor</tspan></text>
  </g>
  <rect class="cursor-2" x="312" y="149" width="7.5" height="15" />

  <!-- نوبت ۳: ziro analyze --full (19 کاراکتر = 161.5px) -->
  <g clip-path="url(#clip-cmd-3)">
    <text class="cli-text" x="312" y="162">ziro <tspan class="hl-blue">analyze --full</tspan></text>
  </g>
  <rect class="cursor-3" x="312" y="149" width="7.5" height="15" />

  <!-- ================= ۴. تایپوگرافی وکتوری اختصاصی ZIRO SHELL ================= -->
  <g transform="translate(0, 6)">
    <!-- Z -->
    <path d="M 295 58 H 345 V 70 L 311 106 H 345 V 118 H 295 V 106 L 329 70 H 295 Z" fill="#cdd6f4" />

    <!-- I (با کلاهک صورتی مدار Eager) -->
    <rect x="362" y="58" width="13" height="13" fill="#f5c2e7" />
    <rect x="362" y="77" width="13" height="41" fill="#cdd6f4" />

    <!-- R -->
    <path d="M 393 58 H 427 C 438 58 445 64 445 75 C 445 83 440 89 431 92 L 446 118 H 431 L 417 93 H 406 V 118 H 393 Z M 406 70 V 82 H 425 C 429 82 432 79.5 432 76 C 432 72.5 429 70 425 70 Z" fill="#cdd6f4" />

    <!-- O (طراحی شده به شکل حلقه مداری با نود سبز Demand) -->
    <circle cx="489" cy="88" r="24" fill="none" stroke="url(#o-ring-grad)" stroke-width="12" />
    <circle cx="506" cy="71" r="4.5" fill="#a6e3a1" stroke="#181825" stroke-width="2" />

    <!-- SHELL -->
    <g fill="none" stroke="#89b4fa" stroke-width="4.5" stroke-linecap="square" stroke-linejoin="miter" opacity="0.9">
      <path d="M 572 64 H 544 V 86 H 572 V 112 H 544" />
      <path d="M 590 62 V 114 M 620 62 V 114 M 590 88 H 620" />
      <path d="M 666 64 H 638 V 112 H 666 M 638 88 H 660" />
      <path d="M 684 62 V 112 H 712" />
      <path d="M 728 62 V 112 H 756" />
    </g>

    <!-- بج معماری در سمت راست لوگو -->
    <rect x="776" y="76" width="112" height="24" fill="#11111b" stroke="#313244" stroke-width="1.2" />
    <text x="832" y="92" fill="#a6e3a1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">3-TIER CORE</text>
  </g>

  <!-- ================= ۵. نوار وضعیت و راهنمای معماری در پایین سمت راست ================= -->
  <g transform="translate(295, 182)">
    <rect class="legend-box" x="0" y="0" width="440" height="30" />

    <!-- Eager Indicator -->
    <circle cx="24" cy="15" r="4.5" fill="#f5c2e7" />
    <text class="legend-text" x="36" y="19">Eager</text>
    <text class="legend-time" x="75" y="19">(Sync)</text>

    <!-- Deferred Indicator -->
    <circle cx="158" cy="15" r="4.5" fill="#89b4fa" />
    <text class="legend-text" x="170" y="19">Deferred</text>
    <text class="legend-time" x="230" y="19">(Idle)</text>

    <!-- Demand Indicator -->
    <circle cx="308" cy="15" r="4.5" fill="#a6e3a1" />
    <text class="legend-text" x="320" y="19">Demand</text>
    <text class="legend-time" x="368" y="19">(Lazy)</text>
  </g>
</svg>
