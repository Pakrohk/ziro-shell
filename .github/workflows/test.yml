name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system pytest
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -m unit -v --tb=short

  integration:
    name: Integration (ubuntu / py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install zsh and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh rsync util-linux
      - uses: astral-sh/setup-uv@v3
      - run: uv pip install --system pytest
      - name: Setup fake HOME with ziro structure
        run: |
          export HOME=/tmp/ziro-ci-home
          mkdir -p $HOME/.local/share/ziro/vendor/Pakrohk
          mkdir -p $HOME/.ziro
          mkdir -p $HOME/.cache/ziro/eval-cache
          mkdir -p $HOME/.config/ziro
          chmod 700 $HOME/.ziro $HOME/.cache/ziro $HOME/.config/ziro
          git clone --depth=1 https://github.com/Pakrohk/ziro-ghost.git $HOME/.local/share/ziro/vendor/Pakrohk/ziro-ghost
          echo 'export ZIRO_HOME=$HOME/.ziro' > $HOME/.zshrc
          echo 'export ZIRO_CACHE=$HOME/.cache/ziro' >> $HOME/.zshrc
          echo 'export ZIRO_CONFIG=$HOME/.config/ziro' >> $HOME/.zshrc
          echo 'export ZIRO_SKIP_VENV_BOOTSTRAP=1' >> $HOME/.zshrc
          touch $HOME/.zsh_history
          chmod 600 $HOME/.zsh_history
      - name: Run integration tests (with pseudo-TTY)
        env:
          PYTHONPATH: .
          HOME: /tmp/ziro-ci-home
        run: |
          script -q -c "cd $(pwd) && HOME=/tmp/ziro-ci-home python -m pytest tests/ -m integration -v --tb=short" /dev/null

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check core/ tests/ --output-format=github || true
      - run: ruff format --check core/ tests/ || true

  zsh-syntax:
    name: Zsh Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: zsh -n install.zsh
      - run: |
          for f in lib/*.zsh; do
            zsh -n "$f" || exit 1
          done
