[project]
name = "ziro-shell"
version = "1.2.0"
description = "Fast, layered Zsh runtime customization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pakrohk" }]

[project.urls]
Homepage = "https://github.com/Pakrohk/ziro-shell"
Repository = "https://github.com/Pakrohk/ziro-shell.git"
Issues = "https://github.com/Pakrohk/ziro-shell/issues"
keywords = ["zsh", "shell", "plugin-manager", "znap"]
classifiers = [
    "Development Status:: 5 - Production/Stable",
    "Environment:: Console",
    "Intended Audience:: Developers",
    "License:: OSI Approved:: MIT License",
    "Programming Language:: Python:: 3.11",
    "Programming Language:: Python:: 3.12",
    "Topic:: System:: Shells",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_deprecated", ".*"]

[tool.ruff]
line-length = 100
target-version = "py311"
