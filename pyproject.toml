[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ziro-shell"
version = "1.2.0"
description = "Fast, layered Zsh runtime customization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pakrohk" }]
keywords = ["zsh", "shell", "plugin-manager", "znap"]
dependencies = [
    "cyclopts>=3.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/Pakrohk/ziro-shell"
Repository = "https://github.com/Pakrohk/ziro-shell.git"
Issues = "https://github.com/Pakrohk/ziro-shell/issues"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_deprecated", ".*"]

[tool.ruff]
line-length = 100
target-version = "py311"
